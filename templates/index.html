<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>MTProxy Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<div class="d-flex justify-content-between">

<h2>MTProxy Panel</h2>

<a href="/logout" class="btn btn-danger">
Выход
</a>

</div>

<hr>

<form action="/create" method="post">

<div class="row mb-4">

<div class="col-md-10">

<input
class="form-control"
name="name"
placeholder="Имя пользователя"
required
>

</div>

<div class="col-md-2">

<button class="btn btn-primary w-100">
Создать
</button>

</div>

</div>

</form>

<table class="table table-bordered">

<thead>

<tr>

<th>Имя</th>
<th>Статус</th>
<th>IP</th>
<th>CONN</th>
<th>Ссылка</th>
<th>Действия</th>

</tr>

</thead>

<tbody>

{% for user in users %}

<tr>

<td>{{ user.name }}</td>

<td>

{% if user.active %}
<span class="badge bg-success">
Активен
</span>
{% else %}
<span class="badge bg-danger">
Бан
</span>
{% endif %}

</td>

<td>{{ user.max_ips }}</td>

<td>{{ user.max_conn }}</td>

<td>

<input
id="link{{ loop.index }}"
class="form-control"
readonly
value="{{ user.link }}"
>

</td>

<td>

<button
class="btn btn-secondary btn-sm"
onclick="navigator.clipboard.writeText(document.getElementById('link{{ loop.index }}').value)"
>
Копировать
</button>

{% if user.active %}

<a
class="btn btn-warning btn-sm"
href="/disable/{{ user.name }}"
>
Бан
</a>

{% else %}

<a
class="btn btn-success btn-sm"
href="/enable/{{ user.name }}"
>
Разбан
</a>

{% endif %}

<a
class="btn btn-danger btn-sm"
href="/delete/{{ user.name }}"
onclick="return confirm('Удалить пользователя?')"
>
Удалить
</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
