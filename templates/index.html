<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MTProxy Panel</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
        
        .btn { padding: 4px 8px; text-decoration: none; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; display: inline-block; font-size: 14px; background: #f0f0f0; color: black; }
        .btn-danger { background: #dc3545; color: white; border: none; }
        .btn-warning { background: #ffc107; color: black; border: none; }
        .btn-success { background: #198754; color: white; border: none; }
        .btn-info { background: #0dcaf0; color: black; border: none; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 12px; color: white; }
        .bg-success { background: #198754; }
        .bg-danger { background: #dc3545; }
        
        .create-form { display: flex; gap: 10px; margin: 20px 0; }
        .form-control { padding: 6px; border: 1px solid #ccc; border-radius: 4px; flex-grow: 1; }
        
        dialog { border: 1px solid #ccc; border-radius: 8px; padding: 20px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
        .dialog-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="header">
    <h2>MTProxy Panel</h2>
    <a href="/logout" class="btn btn-danger">Выход</a>
</div>
<hr>

<!-- Форма создания пользователя -->
<form action="/create" method="post" class="create-form">
    <input class="form-control" name="name" placeholder="Имя пользователя" required>
    <button type="submit" class="btn btn-success">Создать</button>
</form>

<!-- Таблица пользователей -->
<table>
    <thead>
        <tr>
            <th>Имя</th>
            <th>Статус</th>
            <th>IP (Лимит)</th>
            <th>CONN (Лимит)</th>
            <th>Ссылка</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.name }}</td>
            <td>
                {% if user.active %}
                    <span class="badge bg-success">Активен</span>
                {% else %}
                    <span class="badge bg-danger">Бан</span>
                {% endif %}
            </td>
            <!-- Выводим текущие лимиты в ячейки -->
            <td>{{ user.max_ips }}</td>
            <td>{{ user.max_conn }}</td>
            <td>
                <input id="link{{ loop.index }}" class="form-control" readonly value="{{ user.link }}">
            </td>
            <td>
                <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('link{{ loop.index }}').value)">
                    Копировать
                </button>
                
                {% if user.active %}
                    <a class="btn btn-warning" href="/disable/{{ user.name }}">Бан</a>
                {% else %}
                    <a class="btn btn-success" href="/enable/{{ user.name }}">Разбан</a>
                {% endif %}
                
                <a class="btn btn-danger" href="/delete/{{ user.name }}" onclick="return confirm('Удалить пользователя?')">
                    Удалить
                </a>
                
                <!-- Передаем имя и текущие лимиты в функцию Javascript -->
                <button class="btn btn-info" onclick="openLimitModal('{{ user.name }}', '{{ user.max_ips }}', '{{ user.max_conn }}')">
                    Лимит
                </button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- Нативное модальное окно HTML5 -->
<dialog id="limitModal">
    <form id="limitForm" method="post">
        <h3>Лимиты: <span id="modalUserName"></span></h3>
        
        <div style="margin-bottom: 10px;">
            <label style="display:block; margin-bottom:5px;">Максимум IP-адресов</label>
            <input type="number" id="inputIps" name="ips" class="form-control" style="width:100%" min="1" required>
        </div>
        
        <div style="margin-bottom: 10px;">
            <label style="display:block; margin-bottom:5px;">Максимум подключений (CONN)</label>
            <input type="number" id="inputConn" name="conn" class="form-control" style="width:100%" min="1" required>
        </div>
        
        <div class="dialog-buttons">
            <button type="button" class="btn" onclick="document.getElementById('limitModal').close()">Отмена</button>
            <button type="submit" class="btn btn-success">Сохранить</button>
        </div>
    </form>
</dialog>

<script>
    // Функция теперь принимает текущие значения лимитов и подставляет их в форму
    function openLimitModal(userName, currentIps, currentConn) {
        const dialog = document.getElementById('limitModal');
        
        // Настраиваем action формы и заголовок
        document.getElementById('limitForm').action = '/limit/' + userName;
        document.getElementById('modalUserName').innerText = userName;
        
        // Подставляем текущие лимиты из таблицы в поля ввода (если они пусты, будут пустые поля)
        document.getElementById('inputIps').value = currentIps || 3;
        document.getElementById('inputConn').value = currentConn || 10;
        
        dialog.showModal();
    }
</script>

</body>
</html>
